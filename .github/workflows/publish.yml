name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f845c14029ab22cd858fb168b1b26a123285 # v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/upload-action@79aeeb7dbcc06f8ec69947dcd81541a9b12dc798 # v1
        with:
          distribution-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
