[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "progress-receipt"
version = "0.2.1"
description = "Receipts for AI coding work: changes, checks, blockers, and gaps in one shareable report."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "zenovis2-create" },
]
keywords = ["ai", "agent-skill", "cli", "evidence", "git", "report"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zenovis2-create/progress-receipt"
Repository = "https://github.com/zenovis2-create/progress-receipt"
Issues = "https://github.com/zenovis2-create/progress-receipt/issues"

[project.scripts]
progress-receipt = "progress_receipt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/progress_receipt"]

[tool.hatch.build.targets.wheel.force-include]
"skills/visualize-project-progress" = "progress_receipt/skills/visualize-project-progress"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/docs",
  "/examples",
  "/skills",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
